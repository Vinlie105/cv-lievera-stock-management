spring.application.name=cv-lievera-stock-management

# Database — set DB_USERNAME and DB_PASSWORD as environment variables
# For local development, activate the 'local' profile:
#   IntelliJ: Run Config > Active profiles = local
#   Terminal: export SPRING_PROFILES_ACTIVE=local
spring.datasource.url=jdbc:postgresql://localhost:5432/cv_lievera_stock
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA — schema managed by Flyway, not Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — set JWT_SECRET as an environment variable (min 32 chars)
app.jwt.secret=${JWT_SECRET}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ---- Security hardening ----
# Access token 15 min; refresh tokens rotate, idle timeout 30 min, absolute cap 12 h (UC-03)
app.jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY_MS:900000}
app.security.session.idle-minutes=${SESSION_IDLE_MINUTES:30}
app.security.session.absolute-hours=${SESSION_ABSOLUTE_HOURS:12}
app.security.lockout.max-attempts=5
app.security.lockout.minutes=15
app.security.rate-limit.max-requests=10
app.security.rate-limit.window-seconds=60
# Cookies are Secure by default; only the local profile switches this off for http://localhost
app.security.cookie-secure=true
# 32-byte base64 key that encrypts TOTP seeds at rest: openssl rand -base64 32
app.security.encryption-key=${APP_ENCRYPTION_KEY}
# Optional: first-run admin password (otherwise a random one is logged once)
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
# Behind a reverse proxy set SERVER_FORWARD_HEADERS=native so the real client IP is resolved safely
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS:none}
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
spring.jpa.show-sql=false
